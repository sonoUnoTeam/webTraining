name: Django Main Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  main-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config gettext

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate pending model changes
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

      - name: Build static assets
        run: python manage.py collectstatic --noinput

      - name: Build translation files
        run: python manage.py compilemessages

      - name: Upload staticfiles artifact
        uses: actions/upload-artifact@v4
        with:
          name: staticfiles-main
          path: staticfiles/
