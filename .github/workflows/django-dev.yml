name: Django DEV CI

on:
  push:
    branches:
      - DEV
  workflow_dispatch:

jobs:
  django-checks:
    runs-on: ubuntu-latest
    env:
      # Settings exigen SECRET_KEY cuando DEBUG no está activo
      SECRET_KEY: ci-only-insecure-secret-key
      DJANGO_DEBUG: "False"
      ALLOWED_HOSTS: localhost,testserver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # misma versión que producción (/home/nbertaina/my_env)
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate pending model changes
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Run Django system checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

      - name: Verify static files build
        run: python manage.py collectstatic --noinput
